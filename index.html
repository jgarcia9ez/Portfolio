<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMX Technician 3D Tower Portfolio</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-base: #020617;
            --panel-bg: rgba(15, 23, 42, 0.75);
            --panel-border: rgba(255, 183, 77, 0.35);
            --panel-border-glow: rgba(255, 183, 77, 0.6);
            --accent-gold: #ffb74d;
            --accent-glow: #ffa726;
            --accent-cyan: #38bdf8;
            --accent-emerald: #10b981;
            --accent-purple: #a855f7;
            --accent-rose: #f43f5e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-blur: blur(24px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-base);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text-main);
        }

        /* 3D Canvas Container */
        #webgl-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* UI Overlay Layer */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
        }

        .ui-layer * {
            pointer-events: auto;
        }

        /* Hover Tooltip */
        .floor-tooltip {
            position: absolute;
            z-index: 30;
            pointer-events: none;
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--accent-gold);
            padding: 10px 16px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px rgba(255, 183, 77, 0.3);
            display: flex;
            align-items: center;
            gap: 12px;
            transform: translate(15px, 15px);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease, visibility 0.2s ease, transform 0.1s ease-out;
        }

        .floor-tooltip.active {
            opacity: 1;
            visibility: visible;
        }

        .floor-tooltip-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: rgba(255, 183, 77, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-gold);
            font-size: 1.1rem;
        }

        .floor-tooltip-info {
            display: flex;
            flex-direction: column;
        }

        .floor-tooltip-title {
            font-size: 0.95rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: 0.02em;
        }

        .floor-tooltip-subtitle {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--accent-gold);
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
        }

        /* Top Navigation Bar */
        .navbar {
            align-self: center;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 16px;
            background: var(--panel-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--panel-border);
            border-radius: 99px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 183, 77, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
        }

        .navbar:hover {
            border-color: var(--panel-border-glow);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(255, 183, 77, 0.25);
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 18px 6px 12px;
            border-right: 1px solid rgba(255, 255, 255, 0.12);
            font-weight: 800;
            font-size: 0.95rem;
            letter-spacing: 0.08em;
            color: #fff;
            text-transform: uppercase;
        }

        .nav-brand i {
            color: var(--accent-gold);
            font-size: 1.2rem;
            filter: drop-shadow(0 0 8px var(--accent-gold));
        }

        .nav-items {
            display: flex;
            align-items: center;
            gap: 6px;
            list-style: none;
        }

        .nav-item {
            padding: 10px 18px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            border-radius: 99px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-item i {
            font-size: 0.9rem;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .nav-item:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
        }

        .nav-item:hover i {
            transform: scale(1.2);
            color: var(--accent-gold);
        }

        .nav-item.active {
            color: #090d16;
            background: linear-gradient(135deg, #ffb74d 0%, #ffa726 100%);
            font-weight: 800;
            box-shadow: 0 0 25px rgba(255, 183, 77, 0.6);
        }

        .nav-item.active i {
            color: #090d16;
        }

        /* Minimal HUD Controls Footer */
        .hud-hint {
            align-self: center;
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 28px;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: var(--glass-blur);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 99px;
            font-size: 0.82rem;
            color: var(--text-muted);
            letter-spacing: 0.03em;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .hud-hint span {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-main);
            font-weight: 700;
        }

        .hud-hint i {
            color: var(--accent-gold);
        }

        /* Slide-out Glass Content Modal Drawer */
        .drawer-overlay {
            position: absolute;
            top: 0;
            right: 0;
            width: 680px;
            height: 100%;
            z-index: 20;
            background: rgba(8, 12, 20, 0.88);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            border-left: 1px solid var(--panel-border);
            box-shadow: -25px 0 80px rgba(0, 0, 0, 0.9), inset 1px 0 0 rgba(255, 255, 255, 0.1);
            transform: translateX(100%);
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
        }

        .drawer-overlay.active {
            transform: translateX(0);
        }

        .drawer-header {
            padding: 36px 40px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: linear-gradient(180deg, rgba(255, 183, 77, 0.05) 0%, rgba(0, 0, 0, 0) 100%);
        }

        .drawer-title-group {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .drawer-icon-box {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: rgba(255, 183, 77, 0.12);
            border: 1px solid rgba(255, 183, 77, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-gold);
            font-size: 1.3rem;
            box-shadow: 0 0 20px rgba(255, 183, 77, 0.2);
        }

        .drawer-title {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .drawer-subtitle {
            font-size: 0.78rem;
            color: var(--accent-gold);
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            margin-top: 4px;
            font-weight: 600;
        }

        .btn-close {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-close:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.5);
            color: #ef4444;
            transform: rotate(90deg) scale(1.05);
        }

        .drawer-body {
            padding: 40px;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .drawer-body::-webkit-scrollbar {
            width: 6px;
        }

        .drawer-body::-webkit-scrollbar-thumb {
            background: rgba(255, 183, 77, 0.3);
            border-radius: 99px;
        }

        .info-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 24px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .info-card:hover {
            border-color: rgba(255, 183, 77, 0.3);
            background: rgba(255, 255, 255, 0.04);
            transform: translateY(-2px);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 14px;
            color: var(--accent-gold);
        }

        .badge-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        .badge-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: all 0.3s ease;
        }

        .badge-card:hover {
            border-color: rgba(56, 189, 248, 0.4);
            background: rgba(56, 189, 248, 0.05);
            transform: translateY(-2px);
        }

        .badge-card i {
            font-size: 1.5rem;
            color: var(--accent-cyan);
        }

        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .form-group label i {
            color: var(--accent-gold);
        }

        .form-control {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--accent-gold);
            background: rgba(255, 183, 77, 0.05);
            box-shadow: 0 0 20px rgba(255, 183, 77, 0.15);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 110px;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #ffb74d 0%, #ffa726 100%);
            color: #090d16;
            font-weight: 800;
            font-size: 0.95rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 25px rgba(255, 183, 77, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 35px rgba(255, 183, 77, 0.6);
            background: linear-gradient(135deg, #ffc107 0%, #ff9800 100%);
        }

        @media (max-width: 768px) {
            .drawer-overlay {
                width: 100%;
            }
            .navbar {
                width: 100%;
                justify-content: space-between;
                overflow-x: auto;
            }
            .nav-brand {
                display: none;
            }
        }
    </style>

    <!-- Three.js & GSAP Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

    <!-- Dynamic Floor Hover Tooltip -->
    <div class="floor-tooltip" id="floor-tooltip">
        <div class="floor-tooltip-icon" id="tooltip-icon">
            <i class="fa-solid fa-user"></i>
        </div>
        <div class="floor-tooltip-info">
            <div class="floor-tooltip-title" id="tooltip-title">About Me</div>
            <div class="floor-tooltip-subtitle" id="tooltip-subtitle">Floor 1 • Executive Suite</div>
        </div>
    </div>

    <!-- 3D Rendering Canvas -->
    <div id="webgl-container"></div>

    <!-- UI Overlay Layer -->
    <div class="ui-layer">
        <nav class="navbar">
            <div class="nav-brand">
                <i class="fa-solid fa-server"></i>
                <span>PORTFOLIO</span>
            </div>
            <ul class="nav-items" id="nav-list">
                <li class="nav-item" data-floor="0"><i class="fa-solid fa-user"></i> About Me</li>
                <li class="nav-item" data-floor="1"><i class="fa-solid fa-file-lines"></i> Resume</li>
                <li class="nav-item" data-floor="2"><i class="fa-solid fa-certificate"></i> Certifications</li>
                <li class="nav-item" data-floor="3"><i class="fa-solid fa-diagram-project"></i> Projects</li>
                <li class="nav-item" data-floor="4"><i class="fa-solid fa-layer-group"></i> 7HHEP</li>
                <li class="nav-item" data-floor="5"><i class="fa-solid fa-tower-cell"></i> Contact</li>
            </ul>
        </nav>

        <div class="hud-hint">
            <span><i class="fa-solid fa-computer-mouse"></i> Drag</span> to rotate | 
            <span><i class="fa-solid fa-hand-pointer"></i> Click</span> a floor to inspect
        </div>
    </div>

    <!-- Slide-out Drawer Panel -->
    <aside class="drawer-overlay" id="drawer">
        <div class="drawer-header">
            <div class="drawer-title-group">
                <div class="drawer-icon-box" id="drawer-icon">
                    <i class="fa-solid fa-user"></i>
                </div>
                <div>
                    <h2 class="drawer-title" id="drawer-title">About Me</h2>
                    <div class="drawer-subtitle" id="drawer-level">Floor 1 • Executive Suite</div>
                </div>
            </div>
            <button class="btn-close" id="btn-close"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="drawer-body" id="drawer-content"></div>
    </aside>

    <script>
        const TOWER_DATA = [
            {
                id: 0,
                name: "About Me",
                subtitle: "Floor 1 • Executive Suite",
                icon: "fa-user",
                accent: "#ffb74d",
                content: `
                    <div class="info-card">
                        <div class="card-header"><i class="fa-solid fa-id-card"></i> Javi García</div>
                        <p style="color: var(--text-muted); line-height: 1.6;">Técnico en Sistemas Microinformáticos y Redes (SMX). Apasionado por la infraestructura IT, administración de redes, ciberseguridad y entornos virtualizados.</p>
                    </div>
                `
            },
            {
                id: 1,
                name: "Resume",
                subtitle: "Floor 2 • Experience & Education",
                icon: "fa-file-lines",
                accent: "#38bdf8",
                content: `
                    <div class="info-card">
                        <div class="card-header"><i class="fa-solid fa-briefcase"></i> Experiencia Laboral</div>
                        <p style="color: var(--text-muted); margin-bottom: 10px;">Soporte Técnico y Mantenimiento de Hardware / Redes.</p>
                        <div class="card-header"><i class="fa-solid fa-graduation-cap"></i> Educación</div>
                        <p style="color: var(--text-muted);">Grado Medio en Sistemas Microinformáticos y Redes.</p>
                    </div>
                `
            },
            {
                id: 2,
                name: "Certifications",
                subtitle: "Floor 3 • Credentials",
                icon: "fa-certificate",
                accent: "#10b981",
                content: `
                    <div class="badge-grid">
                        <div class="badge-card"><i class="fa-solid fa-network-wired"></i><span>Cisco CCNA</span></div>
                        <div class="badge-card"><i class="fa-solid fa-shield-halved"></i><span>CompTIA Security+</span></div>
                    </div>
                `
            },
            {
                id: 3,
                name: "Projects",
                subtitle: "Floor 4 • Lab & Deployments",
                icon: "fa-diagram-project",
                accent: "#a855f7",
                content: `
                    <div class="info-card">
                        <div class="card-header"><i class="fa-solid fa-server"></i> Home Lab Proxmox</div>
                        <p style="color: var(--text-muted);">Virtualización de servicios con Docker, Active Directory y VPNs.</p>
                    </div>
                `
            },
            {
                id: 4,
                name: "7HHEP",
                subtitle: "Floor 5 • Special Stack",
                icon: "fa-layer-group",
                accent: "#f43f5e",
                content: `
                    <div class="info-card">
                        <div class="card-header"><i class="fa-solid fa-cubes"></i> Arquitectura y Metodología</div>
                        <p style="color: var(--text-muted);">Configuración avanzada de hardware y despliegue continuo.</p>
                    </div>
                `
            },
            {
                id: 5,
                name: "Contact",
                subtitle: "Floor 6 • Communications",
                icon: "fa-tower-cell",
                accent: "#ffa726",
                content: `
                    <form class="contact-form" onsubmit="event.preventDefault(); alert('Mensaje enviado correctamente.');">
                        <div class="form-group">
                            <label><i class="fa-solid fa-envelope"></i> Nombre</label>
                            <input type="text" class="form-control" required placeholder="Tu Nombre">
                        </div>
                        <div class="form-group">
                            <label><i class="fa-solid fa-at"></i> Email</label>
                            <input type="email" class="form-control" required placeholder="tu@email.com">
                        </div>
                        <div class="form-group">
                            <label><i class="fa-solid fa-message"></i> Mensaje</label>
                            <textarea class="form-control" required placeholder="Escribe tu mensaje..."></textarea>
                        </div>
                        <button type="submit" class="btn-submit"><i class="fa-solid fa-paper-plane"></i> Enviar</button>
                    </form>
                `
            }
        ];

        // 3D Scene Variables
        let scene, camera, renderer, controls;
        const floorMeshes = [];
        let activeFloor = null;
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        const tooltip = document.getElementById('floor-tooltip');
        const tooltipTitle = document.getElementById('tooltip-title');
        const tooltipSubtitle = document.getElementById('tooltip-subtitle');
        const tooltipIcon = document.getElementById('tooltip-icon');

        const drawer = document.getElementById('drawer');
        const drawerTitle = document.getElementById('drawer-title');
        const drawerLevel = document.getElementById('drawer-level');
        const drawerIcon = document.getElementById('drawer-icon');
        const drawerContent = document.getElementById('drawer-content');
        const btnClose = document.getElementById('btn-close');

        function init() {
            const container = document.getElementById('webgl-container');
            
            // Scene Setup
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x020617, 0.035);

            // Camera Setup
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(20, 15, 25);

            // Renderer Setup
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 + 0.05;
            controls.minDistance = 10;
            controls.maxDistance = 50;

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffb74d, 1.5);
            dirLight.position.set(15, 30, 15);
            scene.add(dirLight);

            // Tower Construction
            buildTower();

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('click', onClick);

            btnClose.addEventListener('click', closeDrawer);

            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    const floorIdx = parseInt(e.currentTarget.getAttribute('data-floor'));
                    selectFloor(floorIdx);
                });
            });

            animate();
        }

        function buildTower() {
            const floorHeight = 2.2;
            const floorRadius = 3.5;

            TOWER_DATA.forEach((data, index) => {
                const group = new THREE.Group();

                // Base Floor Geometry
                const geo = new THREE.CylinderGeometry(floorRadius, floorRadius, floorHeight * 0.85, 8);
                const mat = new THREE.MeshStandardMaterial({
                    color: 0x0f172a,
                    roughness: 0.3,
                    metalness: 0.8,
                    wireframe: false
                });

                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.y = index * floorHeight;
                mesh.userData = { id: index, data: data };

                // Glowing Ring Accent
                const ringGeo = new THREE.TorusGeometry(floorRadius + 0.05, 0.05, 16, 32);
                const ringMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(data.accent) });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.PI / 2;
                ring.position.y = (index * floorHeight) - (floorHeight * 0.4);

                group.add(mesh);
                group.add(ring);

                scene.add(group);
                floorMeshes.push(mesh);
            });
        }

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            tooltip.style.left = `${event.clientX}px`;
            tooltip.style.top = `${event.clientY}px`;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(floorMeshes);

            if (intersects.length > 0) {
                const hovered = intersects[0].object.userData.data;
                tooltipTitle.textContent = hovered.name;
                tooltipSubtitle.textContent = hovered.subtitle;
                tooltipIcon.innerHTML = `<i class="fa-solid ${hovered.icon}"></i>`;
                tooltip.classList.add('active');
                document.body.style.cursor = 'pointer';
            } else {
                tooltip.classList.remove('active');
                document.body.style.cursor = 'default';
            }
        }

        function onClick() {
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(floorMeshes);

            if (intersects.length > 0) {
                const floorId = intersects[0].object.userData.id;
                selectFloor(floorId);
            }
        }

        function selectFloor(id) {
            activeFloor = id;
            const targetData = TOWER_DATA[id];

            // Highlight Active Nav
            document.querySelectorAll('.nav-item').forEach((item, idx) => {
                if (idx === id) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });

            // Camera Animation to Target Floor
            const targetY = id * 2.2;
            gsap.to(camera.position, {
                x: 14,
                y: targetY + 4,
                z: 14,
                duration: 1.5,
                ease: "power2.inOut"
            });

            gsap.to(controls.target, {
                x: 0,
                y: targetY,
                z: 0,
                duration: 1.5,
                ease: "power2.inOut"
            });

            // Open Drawer Content
            drawerTitle.textContent = targetData.name;
            drawerLevel.textContent = targetData.subtitle;
            drawerIcon.innerHTML = `<i class="fa-solid ${targetData.icon}"></i>`;
            drawerContent.innerHTML = targetData.content;
            drawer.classList.add('active');
        }

        function closeDrawer() {
            drawer.classList.remove('active');
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            
            // Reset Camera
            gsap.to(camera.position, {
                x: 20,
                y: 15,
                z: 25,
                duration: 1.5,
                ease: "power2.inOut"
            });

            gsap.to(controls.target, {
                x: 0,
                y: 5,
                z: 0,
                duration: 1.5,
                ease: "power2.inOut"
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
